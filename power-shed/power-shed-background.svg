<svg viewBox="0 0 1440 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="soften" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>

    <pattern id="brandStripes" width="160" height="160" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0"   width="8" height="160" fill="#fccc38" opacity="0.06"/>
      <rect x="40"  width="8" height="160" fill="#f3393d" opacity="0.06"/>
      <rect x="80"  width="8" height="160" fill="#17afdc" opacity="0.06"/>
      <rect x="120" width="8" height="160" fill="#5358a1" opacity="0.06"/>
    </pattern>

    <!-- Simple zigzag bolt, centered around origin, ~60 wide x 140 tall at scale 1 -->
    <g id="bolt">
      <polyline points="20,0 -10,55 12,55 -20,140 30,60 8,60 34,0"
                fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- dark base -->
  <rect width="1440" height="720" fill="#14171c"/>

  <!-- soft brand-color glows, one per corner -->
  <circle cx="60"   cy="60"  r="260" fill="#fccc38" opacity="0.28" filter="url(#soften)"/>
  <circle cx="1380" cy="60"  r="260" fill="#f3393d" opacity="0.24" filter="url(#soften)"/>
  <circle cx="60"   cy="660" r="260" fill="#17afdc" opacity="0.26" filter="url(#soften)"/>
  <circle cx="1380" cy="660" r="260" fill="#5358a1" opacity="0.28" filter="url(#soften)"/>

  <!-- thin diagonal texture -->
  <rect width="1440" height="720" fill="url(#brandStripes)"/>

  <!-- subtle lightning bolts, low-opacity linework tying the theme to "power" -->
  <use href="#bolt" transform="translate(230,90)  scale(1.3) rotate(8)"   stroke="#fccc38" opacity="0.10"/>
  <use href="#bolt" transform="translate(1140,60) scale(1.6) rotate(-6)"  stroke="#f3393d" opacity="0.09"/>
  <use href="#bolt" transform="translate(720,260) scale(2.4) rotate(4)"   stroke="#17afdc" opacity="0.07"/>
  <use href="#bolt" transform="translate(200,560) scale(1.4) rotate(-10)" stroke="#5358a1" opacity="0.10"/>
  <use href="#bolt" transform="translate(1220,600) scale(1.2) rotate(12)" stroke="#fccc38" opacity="0.09"/>

  <!-- gentle vignette so tiles in the center stay highest-contrast -->
  <rect width="1440" height="720" fill="#14171c" opacity="0.35"/>
</svg>
