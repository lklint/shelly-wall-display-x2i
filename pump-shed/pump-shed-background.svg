<svg viewBox="0 0 1440 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="soften" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>

    <pattern id="brandStripes" width="160" height="160" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0"   width="8" height="160" fill="#fccc38" opacity="0.06"/>
      <rect x="40"  width="8" height="160" fill="#f3393d" opacity="0.06"/>
      <rect x="80"  width="8" height="160" fill="#17afdc" opacity="0.06"/>
      <rect x="120" width="8" height="160" fill="#5358a1" opacity="0.06"/>
    </pattern>

    <!-- Water droplet outline, centered around origin, ~70 wide x 100 tall at scale 1 -->
    <g id="drop">
      <path d="M 0,-50
               C 26,-8 35,22 35,40
               C 35,62 20,80 0,80
               C -20,80 -35,62 -35,40
               C -35,22 -26,-8 0,-50 Z"
            fill="none" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
    </g>

    <!-- Simple ripple rings, centered around origin -->
    <g id="ripple">
      <circle r="30" fill="none" stroke-width="3.5"/>
      <circle r="52" fill="none" stroke-width="3"/>
      <circle r="74" fill="none" stroke-width="2.5"/>
    </g>
  </defs>

  <!-- dark base -->
  <rect width="1440" height="720" fill="#14171c"/>

  <!-- soft brand-color glows, one per corner -->
  <circle cx="60"   cy="60"  r="260" fill="#17afdc" opacity="0.26" filter="url(#soften)"/>
  <circle cx="1380" cy="60"  r="260" fill="#5358a1" opacity="0.24" filter="url(#soften)"/>
  <circle cx="60"   cy="660" r="260" fill="#fccc38" opacity="0.22" filter="url(#soften)"/>
  <circle cx="1380" cy="660" r="260" fill="#17afdc" opacity="0.28" filter="url(#soften)"/>

  <!-- thin diagonal texture -->
  <rect width="1440" height="720" fill="url(#brandStripes)"/>

  <!-- subtle water droplets -->
  <use href="#drop" transform="translate(240,110)  scale(1.2) rotate(-4)"  stroke="#17afdc" opacity="0.02"/>
  <use href="#drop" transform="translate(1150,90)  scale(1.5) rotate(6)"   stroke="#5358a1" opacity="0.018"/>
  <use href="#drop" transform="translate(210,580)  scale(1.3) rotate(3)"   stroke="#fccc38" opacity="0.018"/>
  <use href="#drop" transform="translate(1230,590) scale(1.1) rotate(-6)"  stroke="#17afdc" opacity="0.02"/>

  <!-- subtle ripple motif, off-center, large and faint -->
  <use href="#ripple" transform="translate(760,300) scale(2.6)" stroke="#17afdc" opacity="0.012"/>

  <!-- gentle vignette so tiles in the center stay highest-contrast -->
  <rect width="1440" height="720" fill="#14171c" opacity="0.35"/>
</svg>
