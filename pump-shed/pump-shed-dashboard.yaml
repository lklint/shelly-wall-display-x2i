# =============================================================================
# Pump Shed Dashboard — Shelly Wall Display X2i (1440x720)
# =============================================================================
# See README.md in this repo for full setup instructions.
#
# REQUIRES (install both via HACS > Frontend before loading this dashboard):
#   - button-card   https://github.com/custom-cards/button-card
#   - card-mod      https://github.com/thomasloven/lovelace-card-mod
#
# BEFORE USE: every entity_id in this file is a placeholder (e.g.
# switch.bore_pump). Find-and-replace them with your own — see the
# "Entities used" table in README.md for the full list. Also set the
# gauge's "max:" value to your own tank's capacity in litres.
# =============================================================================

title: Pump Shed

# kiosk_mode requires the "Kiosk Mode" HACS integration (github.com/NemesisRE/kiosk-mode).
# hide_sidebar removes HA's left sidebar. hide_header removes HA's own top tab bar —
# we hide it because the button-card nav rail (bottom of this file) replaces it.
kiosk_mode:
  admin_settings:
    hide_header: false
    hide_sidebar: false
  hide_header: true
  hide_sidebar: true

# -----------------------------------------------------------------------------
# REUSABLE TEMPLATES
# Every tile/button on this dashboard is built from one of these four templates,
# so the look stays consistent and you only need to change styling in one place.
# -----------------------------------------------------------------------------
button_card_templates:

  # A single nav rail icon, inactive state. Transparent background, muted icon color.
  navbtn:
    show_icon: true
    show_name: false
    show_label: false
    show_state: false
    styles:
      card:
        - width: 60px
        - height: 60px
        - border-radius: 16px
        - background: transparent
        - border: none
        - box-shadow: none
        - display: flex
        - align-items: center
        - justify-content: center
        - margin: 6px auto
      icon:
        - width: 28px
        - height: 28px
        - color: "#E8ECE6"

  # Same as navbtn, but with a soft amber highlight — used for whichever page
  # you're currently on. Each view's nav list manually marks its own icon with
  # this template instead of navbtn; there's no automatic "current page" detection.
  navbtn_active:
    show_icon: true
    show_name: false
    show_label: false
    show_state: false
    styles:
      card:
        - width: 60px
        - height: 60px
        - border-radius: 16px
        - background: "rgba(255, 184, 77, 0.16)"
        - border: none
        - box-shadow: none
        - display: flex
        - align-items: center
        - justify-content: center
        - margin: 6px auto
      icon:
        - width: 28px
        - height: 28px
        - color: "#FFB84D"

  # A numeric readout tile — icon on top, name, then a big bold value below.
  # Used for Tank Level trend graph header and could be reused for anything
  # else numeric you add later (flow rate, pressure, etc).
  #
  # NOTE on img_cell: button-card's icon sits inside its own "img_cell" container,
  # and if that container isn't given an explicit size, it can collapse to zero
  # height — the icon will have a color but nothing visible to show it in. Giving
  # img_cell explicit width/height/display:flex is what makes the icon actually
  # render. Skipping this was the single biggest time-sink building this dashboard
  # (see the sister power-shed dashboard's comments for the full story).
  stattile:
    show_icon: true
    show_name: true
    show_label: true
    show_state: false
    color_type: icon   # lets a top-level "color:" field tint the icon
    size: 40px
    styles:
      card:
        - background: "rgba(255, 255, 255, 0.05)"
        - border-radius: 16px
        - border: none
        - box-shadow: none
        - padding: 10px 6px
        - height: 100%
      img_cell:
        - width: 100%
        - height: 40px
        - display: flex
        - align-items: center
        - justify-content: center
        - margin-bottom: 6px
      name:
        - font-size: 18px
        - font-weight: 600
        - color: "#cfd3d9"
        - margin-bottom: 2px
      label:
        - font-size: 30px
        - font-weight: 700
        - color: "#f4f6f2"

  # Same visual footprint as stattile (icon-top, name, big value), but for
  # on/off switches instead of numeric readouts: show_state instead of a
  # custom label, color:auto for automatic on/off tinting, and tap_action
  # to toggle whichever entity the tile is bound to. Used for Bore Pump,
  # Transfer Pump, and the Pump Shed Light.
  toggletile:
    show_icon: true
    show_name: true
    show_state: true
    show_label: false
    color_type: icon
    color: auto
    size: 40px
    tap_action:
      action: toggle
    styles:
      card:
        - background: "rgba(255, 255, 255, 0.05)"
        - border-radius: 16px
        - border: none
        - box-shadow: none
        - padding: 10px 6px
        - height: 100%
      img_cell:
        - width: 100%
        - height: 40px
        - display: flex
        - align-items: center
        - justify-content: center
        - margin-bottom: 6px
      name:
        - font-size: 16px
        - font-weight: 600
        - color: "#cfd3d9"
        - margin-bottom: 2px
      state:
        - font-size: 20px
        - font-weight: 700
        - color: "#f4f6f2"

views:
  # ---------------------------------------------------------------------
  # VIEW 1: WATER
  # ---------------------------------------------------------------------
  - title: Water
    path: water
    icon: mdi:water-pump
    type: panel   # panel = one card fills the whole screen width, no HA margins
    cards:
      # ---------------------------------------------------------------------
      # PAGE SKELETON — this same pattern repeats at the top of every view in
      # this file. It's a single button-card using CSS Grid to split the
      # screen into two areas: "content" (everything on the left, scrollable
      # if it overflows) and "nav" (the fixed 84px icon rail on the right).
      # Only the actual tiles inside custom_fields.content differ per view —
      # the grid/background/nav-rail plumbing below is identical everywhere.
      # ---------------------------------------------------------------------
      - type: custom:button-card
        show_name: false
        show_icon: false
        show_label: false
        styles:
          card:
            - width: 100vw
            - height: 100vh
            - background: url('/local/pump-shed-background.png') center/cover
            - padding: 0
            - margin: 0
            - border: none
            - box-shadow: none
            - overflow: hidden
          grid:
            - display: grid
            - grid-template-areas: '"content nav"'
            - grid-template-columns: 1fr 84px   # content flexes, nav rail is fixed-width
            - grid-template-rows: minmax(0, 1fr) # minmax(0,...) lets content scroll instead of overflowing the screen
            - height: 100vh
            - width: 100vw
          custom_fields:
            content:
              - grid-area: content
              - overflow-y: auto              # scrolls if a view's content is taller than the screen
              - min-height: 0
              - align-content: start
              - padding: 14px
              - -webkit-overflow-scrolling: touch  # needed for smooth touch-scroll in the X2i's Android WebView
              - touch-action: pan-y
            nav:
              - grid-area: nav
              - display: flex
              - flex-direction: column
              - align-items: center
              - justify-content: center
              - background: "rgba(0, 0, 0, 0.25)"
              - height: 100vh
        custom_fields:
          # content: 2x2 tile grid — two toggles up top, then a third toggle
          # paired with the tank gauge below. Originally this was 3 toggles in
          # one row plus the gauge/tile alone on its own row; 2x2 reads better
          # and uses the screen's width more evenly.
          content:
            card:
              type: vertical-stack
              cards:
                - type: horizontal-stack
                  cards:
                    - type: custom:button-card
                      template: toggletile
                      entity: switch.bore_pump
                      name: Bore Pump
                      icon: mdi:pump

                    - type: custom:button-card
                      template: toggletile
                      entity: switch.transfer_pump
                      name: Transfer Pump
                      icon: mdi:pump

                - type: horizontal-stack
                  cards:
                    - type: custom:button-card
                      template: toggletile
                      entity: switch.pump_shed_light
                      name: Shed Light
                      icon: mdi:ceiling-light

                    # Native "gauge" card (not button-card) — chosen over a stattile
                    # here because a radial gauge makes % of tank capacity easier to
                    # read at a glance than a bare number would. card_mod (a separate
                    # HACS install) is what lets us re-style this native card's
                    # background to match the button-card tiles around it; button-card
                    # styling only applies to button-card elements, not native ones.
                    - type: gauge
                      entity: sensor.tank_level_litres
                      name: Tank Level
                      min: 0
                      max: 10000 # <-- SET THIS to your tank's capacity in litres
                      severity:
                        red: 0
                        yellow: 2000  # 20% of max
                        green: 5000   # 50% of max
                      card_mod:
                        style: |
                          ha-card {
                            background: rgba(255, 255, 255, 0.05);
                            border-radius: 16px;
                            box-shadow: none;
                            border: none;
                          }

          # nav: the right-side icon rail, identical structure on every view — a
          # vertical-stack of 3 nav buttons, one per page. Whichever page you're
          # currently viewing uses the navbtn_active template instead of navbtn;
          # this is set manually per view rather than detected automatically, so
          # if you add a 4th page, remember to update the icon list on ALL views,
          # not just the new one.
          nav:
            card:
              type: vertical-stack
              cards:
                - type: custom:button-card
                  template: navbtn_active
                  icon: mdi:water-pump
                  tap_action:
                    action: navigate
                    navigation_path: /pump-shed/water
                - type: custom:button-card
                  template: navbtn
                  icon: mdi:chart-line
                  tap_action:
                    action: navigate
                    navigation_path: /pump-shed/trend
                - type: custom:button-card
                  template: navbtn
                  icon: mdi:cctv
                  tap_action:
                    action: navigate
                    navigation_path: /pump-shed/cameras

  # ---------------------------------------------------------------------
  # VIEW 2: TREND
  # ---------------------------------------------------------------------
  # Same page-skeleton pattern as Water above (see its comments for details
  # on the grid/nav-rail mechanism). This page exists purely to give the
  # history graph its own full screen — native chart cards render taller
  # than you'd expect (see the note on the history-graph card below), and
  # trying to fit one alongside the Water tab's tiles caused it to get
  # visually clipped. Giving it a dedicated tab was the simplest fix.
  - title: Trend
    path: trend
    icon: mdi:chart-line
    type: panel
    cards:
      - type: custom:button-card
        show_name: false
        show_icon: false
        show_label: false
        styles:
          card:
            - width: 100vw
            - height: 100vh
            - background: url('/local/pump-shed-background.png') center/cover
            - padding: 0
            - margin: 0
            - border: none
            - box-shadow: none
            - overflow: hidden
          grid:
            - display: grid
            - grid-template-areas: '"content nav"'
            - grid-template-columns: 1fr 84px
            - grid-template-rows: minmax(0, 1fr)
            - height: 100vh
            - width: 100vw
          custom_fields:
            content:
              - grid-area: content
              - overflow-y: auto
              - min-height: 0
              - align-content: start
              - padding: 14px
              - -webkit-overflow-scrolling: touch
              - touch-action: pan-y
            nav:
              - grid-area: nav
              - display: flex
              - flex-direction: column
              - align-items: center
              - justify-content: center
              - background: "rgba(0, 0, 0, 0.25)"
              - height: 100vh
        custom_fields:
          content:
            card:
              type: vertical-stack
              cards:
                # Native "history-graph" card. It has no height setting of its own —
                # it renders taller with more entities/longer time ranges, and can't
                # be shrunk directly. On the Water tab (a shorter page with other
                # tiles), this graph pushed content off-screen; here it has the
                # whole page to itself so that's not a problem. If you need to fit
                # a chart alongside other tiles elsewhere, card-mod's max-height +
                # overflow:hidden (see the power-shed dashboard's comments, or just
                # add "card_mod: style: |" under this card) is the way to force it
                # into a smaller box.
                - type: history-graph
                  title: Bore Tank Level (7 days)
                  hours_to_show: 168
                  entities:
                    - entity: sensor.tank_level_litres

          nav:
            card:
              type: vertical-stack
              cards:
                - type: custom:button-card
                  template: navbtn
                  icon: mdi:water-pump
                  tap_action:
                    action: navigate
                    navigation_path: /pump-shed/water
                - type: custom:button-card
                  template: navbtn_active
                  icon: mdi:chart-line
                  tap_action:
                    action: navigate
                    navigation_path: /pump-shed/trend
                - type: custom:button-card
                  template: navbtn
                  icon: mdi:cctv
                  tap_action:
                    action: navigate
                    navigation_path: /pump-shed/cameras

  # ---------------------------------------------------------------------
  # VIEW 3: CAMERAS
  # ---------------------------------------------------------------------
  # Same page-skeleton pattern as Water above (see its comments for details
  # on the grid/nav-rail mechanism). Two native picture-entity cards side by
  # side via horizontal-stack, same reasoning as the power-shed dashboard's
  # camera tab: this screen is short and wide, so side-by-side fits better
  # than stacking cameras vertically.
  - title: Cameras
    path: cameras
    icon: mdi:cctv
    type: panel
    cards:
      - type: custom:button-card
        show_name: false
        show_icon: false
        show_label: false
        styles:
          card:
            - width: 100vw
            - height: 100vh
            - background: url('/local/pump-shed-background.png') center/cover
            - padding: 0
            - margin: 0
            - border: none
            - box-shadow: none
            - overflow: hidden
          grid:
            - display: grid
            - grid-template-areas: '"content nav"'
            - grid-template-columns: 1fr 84px
            - grid-template-rows: minmax(0, 1fr)
            - height: 100vh
            - width: 100vw
          custom_fields:
            content:
              - grid-area: content
              - overflow-y: auto
              - min-height: 0
              - align-content: start
              - padding: 14px
              - -webkit-overflow-scrolling: touch
              - touch-action: pan-y
            nav:
              - grid-area: nav
              - display: flex
              - flex-direction: column
              - align-items: center
              - justify-content: center
              - background: "rgba(0, 0, 0, 0.25)"
              - height: 100vh
        custom_fields:
          content:
            card:
              type: horizontal-stack
              cards:
                - show_state: true
                  show_name: true
                  camera_view: live
                  fit_mode: cover
                  type: picture-entity
                  entity: camera.pump_shed_camera_1
                  name: Camera 1
                  aspect_ratio: "4:3"

                - show_state: true
                  show_name: true
                  camera_view: live
                  fit_mode: cover
                  type: picture-entity
                  entity: camera.pump_shed_camera_2
                  name: Camera 2
                  aspect_ratio: "4:3"

          nav:
            card:
              type: vertical-stack
              cards:
                - type: custom:button-card
                  template: navbtn
                  icon: mdi:water-pump
                  tap_action:
                    action: navigate
                    navigation_path: /pump-shed/water
                - type: custom:button-card
                  template: navbtn
                  icon: mdi:chart-line
                  tap_action:
                    action: navigate
                    navigation_path: /pump-shed/trend
                - type: custom:button-card
                  template: navbtn_active
                  icon: mdi:cctv
                  tap_action:
                    action: navigate
                    navigation_path: /pump-shed/cameras
